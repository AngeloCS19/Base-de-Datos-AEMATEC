<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700&family=Source+Serif+4:wght@400;500;600&display=swap" rel="stylesheet">
  <script>tailwind.config={theme:{extend:{fontFamily:{sans:['Montserrat','sans-serif'],serif:['Source Serif 4','serif']}}}}</script>
  <script src="assets/firebase-config.js"></script>
  <title>Moderación — Biblioteca AEMATEC</title>
</head>
<body class="min-h-screen bg-[#F4F8FA] text-[#0D2B45] font-serif" style="background-image: radial-gradient(circle at 12% 18%, rgba(0, 175, 193, 0.13) 0, rgba(0, 175, 193, 0.13) 1.2px, transparent 1.8px), radial-gradient(circle at 84% 72%, rgba(13, 43, 69, 0.09) 0, rgba(13, 43, 69, 0.09) 1.2px, transparent 1.8px); background-size: 28px 28px, 36px 36px;">
  <header class="border-b border-[#D8E3E9] bg-white">
    <div class="mx-auto flex max-w-[1100px] items-center justify-between px-6 py-5">
      <a href="index.html" class="flex items-center gap-4 font-sans text-lg font-bold" aria-label="Ir al inicio">
        <img src="assets/logo-aematec.svg" alt="Logo AEMATEC" class="h-12 w-auto">
        <span class="hidden border-l border-[#D8E3E9] pl-4 sm:inline">Biblioteca AEMATEC</span>
      </a>
      <div class="flex items-center gap-5"><span class="font-sans text-xs font-semibold text-[#607480]">Panel de moderación</span><a href="index.html" class="font-sans text-xs font-bold text-[#008F9E] hover:text-[#00A6B8]"><i class="fa-solid fa-arrow-left mr-1"></i>Volver al inicio</a></div>
    </div>
  </header>
  <main class="mx-auto max-w-[1100px] px-6 py-10">
    <section id="login-panel" class="mx-auto max-w-[430px] rounded-[18px] border border-[#D7E2E7] bg-white p-8 shadow-sm">
      <h1 class="font-sans text-2xl font-bold">Acceso de moderador</h1>
      <p class="mt-2 text-[#607480]">Inicia sesión para revisar los materiales pendientes.</p>
      <form id="login-form" class="mt-6 space-y-4">
        <div><label for="email" class="font-sans text-xs font-bold">Correo</label><input id="email" type="email" required autocomplete="email" class="mt-2 h-11 w-full rounded-[9px] border border-[#BFD0D8] px-3"></div>
        <div><label for="password" class="font-sans text-xs font-bold">Contraseña</label><input id="password" type="password" required autocomplete="current-password" class="mt-2 h-11 w-full rounded-[9px] border border-[#BFD0D8] px-3"></div>
        <button class="h-11 w-full rounded-[9px] bg-[#0D2B45] font-sans text-sm font-bold text-white">Iniciar sesión</button>
        <p id="login-status" role="alert" class="text-sm text-[#C2413B]" hidden></p>
      </form>
    </section>
    <section id="moderation-panel" hidden>
      <div class="flex flex-wrap items-end justify-between gap-4">
        <div><p class="font-sans text-xs font-bold uppercase tracking-[0.12em] text-[#00A6B8]">Revisión</p><h1 class="mt-2 font-sans text-3xl font-bold">Materiales pendientes</h1></div>
        <button id="logout" type="button" class="rounded-[9px] border border-[#AFC2CB] bg-white px-5 py-3 font-sans text-xs font-bold">Cerrar sesión</button>
      </div>
      <p id="panel-status" role="status" class="mt-5 text-sm text-[#607480]"></p>
      <div id="pending-list" class="mt-6 space-y-4"></div>
      <section class="mt-10 rounded-[16px] border border-[#D7E2E7] bg-white p-6 shadow-sm">
        <h2 class="font-sans text-xl font-bold">Moderadores</h2>
        <p class="mt-2 text-sm text-[#607480]">Agrega o quita correos autorizados. Cada persona también debe tener una cuenta habilitada en Firebase Authentication.</p>
        <form id="moderator-form" class="mt-5 flex flex-wrap gap-3">
          <label for="moderator-email" class="sr-only">Correo del moderador</label>
          <input id="moderator-email" type="email" required placeholder="correo@ejemplo.com" class="h-11 min-w-[260px] flex-1 rounded-[9px] border border-[#BFD0D8] px-3">
          <button class="h-11 rounded-[9px] bg-[#0D2B45] px-5 font-sans text-xs font-bold text-white">Agregar moderador</button>
        </form>
        <p id="moderator-status" role="status" class="mt-3 text-sm" hidden></p>
        <ul id="moderator-list" class="mt-5 divide-y divide-[#E2E9EC]"></ul>
      </section>
    </section>
  </main>
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import { getAuth, onAuthStateChanged, signInWithEmailAndPassword, signOut } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
    import { getFirestore, collection, getDocs, getDoc, query, where, updateDoc, deleteDoc, doc, setDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
    import { getStorage, ref, deleteObject } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-storage.js";

    const moderatorEmail = "angeloyeshuac@gmail.com";
    const app = initializeApp(window.AEMATEC_FIREBASE_CONFIG);
    const auth = getAuth(app);
    const db = getFirestore(app);
    const storage = getStorage(app);
    const loginPanel = document.querySelector("#login-panel");
    const moderationPanel = document.querySelector("#moderation-panel");
    const pendingList = document.querySelector("#pending-list");
    const panelStatus = document.querySelector("#panel-status");
    const escapeHtml = value => String(value || "").replace(/[&<>"']/g, character => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#039;" }[character]));
    const fileSize = bytes => bytes ? `${(bytes / 1024 / 1024).toFixed(2)} MB` : "Tamaño no indicado";

    document.querySelector("#login-form").addEventListener("submit", async event => {
      event.preventDefault();
      const status = document.querySelector("#login-status");
      status.hidden = true;
      try {
        await signInWithEmailAndPassword(auth, document.querySelector("#email").value.trim(), document.querySelector("#password").value);
      } catch (error) {
        status.textContent = "No se pudo iniciar sesión. Verifica el correo y la contraseña.";
        status.hidden = false;
      }
    });
    document.querySelector("#logout").addEventListener("click", () => signOut(auth));
    document.querySelector("#moderator-form").addEventListener("submit", async event => {
      event.preventDefault();
      const status = document.querySelector("#moderator-status");
      const email = document.querySelector("#moderator-email").value.trim().toLowerCase();
      try {
        await setDoc(doc(db, "moderators", email), { email, addedAt: new Date().toISOString() });
        event.target.reset();
        await loadModerators();
        status.textContent = "Moderador agregado.";
        status.className = "mt-3 text-sm text-[#087F8C]";
        status.hidden = false;
      } catch (error) {
        status.textContent = `No se pudo agregar el moderador: ${error.message}`;
        status.className = "mt-3 text-sm text-[#C2413B]";
        status.hidden = false;
      }
    });

    async function loadModerators() {
      const list = document.querySelector("#moderator-list");
      const snapshot = await getDocs(collection(db, "moderators"));
      list.innerHTML = snapshot.docs.map(item => `<li class="flex items-center justify-between gap-4 py-3"><span class="font-sans text-sm">${escapeHtml(item.id)}</span><button type="button" data-remove-moderator="${escapeHtml(item.id)}" class="font-sans text-xs font-bold text-[#C2413B]">Quitar</button></li>`).join("");
      list.querySelectorAll("[data-remove-moderator]").forEach(button => button.addEventListener("click", async () => {
        if (button.dataset.removeModerator === moderatorEmail) {
          document.querySelector("#moderator-status").textContent = "No puedes quitar al administrador principal.";
          document.querySelector("#moderator-status").className = "mt-3 text-sm text-[#C2413B]";
          document.querySelector("#moderator-status").hidden = false;
          return;
        }
        if (!confirm(`¿Quitar a ${button.dataset.removeModerator} como moderador?`)) return;
        await deleteDoc(doc(db, "moderators", button.dataset.removeModerator));
        await loadModerators();
      }));
    }

    async function loadPending() {
      panelStatus.textContent = "Cargando materiales...";
      const snapshot = await getDocs(query(collection(db, "resources"), where("status", "==", "pending")));
      if (snapshot.empty) {
        panelStatus.textContent = "No hay materiales pendientes de revisión.";
        pendingList.innerHTML = "";
        return;
      }
      panelStatus.textContent = `${snapshot.size} material(es) pendiente(s).`;
      pendingList.innerHTML = snapshot.docs.map(item => {
        const resource = item.data();
        return `<article class="rounded-[16px] border border-[#D7E2E7] bg-white p-6 shadow-sm">
          <div class="flex flex-wrap items-start justify-between gap-3"><div><span class="font-sans text-[10px] font-bold uppercase text-[#00A6B8]">${escapeHtml(resource.type)}</span><h2 class="mt-2 font-sans text-xl font-bold">${escapeHtml(resource.title)}</h2></div><span class="rounded-full bg-[#FFF1D9] px-3 py-1 font-sans text-[10px] font-bold text-[#946316]">PENDIENTE</span></div>
          <p class="mt-3 leading-6 text-[#607480]">${escapeHtml(resource.description)}</p>
          <dl class="mt-4 grid gap-2 text-sm text-[#405968] sm:grid-cols-2"><div><strong>Autor:</strong> ${escapeHtml(resource.author)}</div><div><strong>Curso:</strong> ${escapeHtml(resource.course || "No indicado")}</div><div><strong>Materiales:</strong> ${escapeHtml(resource.materials || "No indicados")}</div><div><strong>Internet:</strong> ${resource.requiresInternet ? "Sí" : "No"} · ${escapeHtml((resource.extension || "").toUpperCase())} · ${fileSize(resource.size)}</div></dl>
          <div class="mt-5 flex flex-wrap gap-3"><a href="${escapeHtml(resource.fileUrl)}" target="_blank" rel="noopener" class="rounded-[8px] border border-[#9DB6C1] px-4 py-2 font-sans text-xs font-bold">Ver archivo</a><button data-action="approved" data-id="${item.id}" class="rounded-[8px] bg-[#00AFC1] px-4 py-2 font-sans text-xs font-bold text-white">Aprobar y publicar</button><button data-action="rejected" data-id="${item.id}" class="rounded-[8px] border border-[#C2413B] px-4 py-2 font-sans text-xs font-bold text-[#C2413B]">Rechazar</button><button data-action="delete" data-id="${item.id}" class="rounded-[8px] border border-[#AFC2CB] px-4 py-2 font-sans text-xs font-bold">Eliminar</button></div>
        </article>`;
      }).join("");
      pendingList.querySelectorAll("button[data-action]").forEach(button => button.addEventListener("click", () => handleAction(button.dataset.action, button.dataset.id)));
    }

    async function handleAction(action, id) {
      const resourceDocument = await getDoc(doc(db, "resources", id));
      if (!resourceDocument.exists()) return;
      const resource = resourceDocument.data();
      try {
        if (action === "delete") {
          if (!confirm("¿Eliminar este material y su archivo definitivamente?")) return;
          if (resource.storagePath) await deleteObject(ref(storage, resource.storagePath));
          await deleteDoc(doc(db, "resources", id));
        } else {
          await updateDoc(doc(db, "resources", id), { status: action, published: action === "approved" });
        }
        await loadPending();
      } catch (error) {
        panelStatus.textContent = `No se pudo completar la acción: ${error.message}`;
      }
    }

    onAuthStateChanged(auth, async user => {
      const email = user?.email?.toLowerCase();
      let allowed = email === moderatorEmail;
      if (email && !allowed) {
        const moderatorDocument = await getDoc(doc(db, "moderators", email));
        allowed = moderatorDocument.exists();
      }
      loginPanel.hidden = allowed;
      moderationPanel.hidden = !allowed;
      if (allowed) {
        loadPending().catch(error => { panelStatus.textContent = `No se pudieron cargar los pendientes: ${error.message}`; });
        loadModerators().catch(error => { document.querySelector("#moderator-status").textContent = `No se pudieron cargar los moderadores: ${error.message}`; });
      } else if (user) {
        document.querySelector("#login-status").textContent = "Esta cuenta no tiene permisos de moderador.";
        document.querySelector("#login-status").hidden = false;
        await signOut(auth);
      }
    });
  </script>
</body>
</html>
